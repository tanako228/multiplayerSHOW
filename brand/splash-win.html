<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MP Show</title>
<!-- Заставка при запуске: отдельное прозрачное окно без рамки (main.js → createSplash).
     Иконки инструментов быстро перекидываются карточкой, в конце — значок и надпись multiplayerSHOW.
     Фона нет — видно рабочий стол. Программа готова — window.finish() (быстро к значку, промис — когда надпись видна); убрать — window.bye().
     ?demo — показ в браузере: подложка «рабочий стол» и кнопки повтора. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #row { position: relative; display: flex; align-items: center; }
  #card { position: relative; width: 104px; height: 104px; opacity: 0; transform-style: preserve-3d; }
  #card svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,.45)) drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  #glow { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, var(--g, #5b95ff) 0%, transparent 62%); opacity: 0; filter: blur(8px); transition: --g .2s; }
  #ring { position: absolute; left: 50%; top: 50%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 30px;
    border: 2px solid #F5A524; opacity: 0; pointer-events: none; }
  #words { width: 0; overflow: hidden; flex: none; padding: 18px 0; }
  /* Мягкая тёмная дымка за надписью — читается и на светлом рабочем столе */
  #smoke { position: absolute; left: 60px; top: 50%; width: 420px; height: 130px; margin-top: -65px; pointer-events: none; opacity: 0;
    background: radial-gradient(closest-side, rgba(8,12,24,.62), rgba(8,12,24,.36) 55%, transparent); filter: blur(10px); }
  #words svg { display: block; width: 300px; height: auto; margin-left: 24px; overflow: visible; opacity: 0;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.55)) drop-shadow(0 0 1.5px rgba(0,0,0,.5)); }
  #words .wa { fill: #fff; } #words .wb { fill: #F5A524; }
  #label { position: absolute; left: 50%; top: calc(50% + 74px); transform: translateX(-50%); white-space: nowrap;
    font-size: 12px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: #fff; opacity: 0;
    text-shadow: 0 1px 6px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.6); }
  #wait { position: absolute; left: 50%; top: calc(50% + 70px); width: 140px; height: 2px; margin-left: -70px; border-radius: 1px; overflow: hidden;
    background: rgba(255,255,255,.18); box-shadow: 0 1px 6px rgba(0,0,0,.4); opacity: 0; transition: opacity .4s; }
  #wait::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 1px; background: #F5A524; animation: wait 1.1s ease-in-out infinite; }
  #wait.on { opacity: 1; }
  @keyframes wait { from { left: -40%; } to { left: 100%; } }
  /* Значок программы: рамки дорисовываются, оранжевый экран и «плей» выпрыгивают */
  .lg-ln { fill: none; stroke: #4C7DFF; stroke-width: 6; stroke-dasharray: 260; stroke-dashoffset: 260; animation: lgDraw .5s .05s cubic-bezier(.5,0,.2,1) forwards; }
  .lg-ln.b { animation-delay: .14s; }
  .lg-am { fill: #F5A524; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: lgPop .45s .26s cubic-bezier(.3,1.6,.5,1) forwards; }
  .lg-pl { fill: #0F1420; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: lgPop .4s .42s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes lgDraw { to { stroke-dashoffset: 0; } }
  @keyframes lgPop { to { transform: none; } }
  @property --g { syntax: '<color>'; inherits: false; initial-value: #5b95ff; }

  /* Показ в браузере */
  body.demo { background: #1b2a4a url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000'><defs><radialGradient id='a' cx='.35' cy='.6' r='.7'><stop offset='0' stop-color='%234a7bd8'/><stop offset='.5' stop-color='%23243f86'/><stop offset='1' stop-color='%23101a3a'/></radialGradient><radialGradient id='b' cx='.75' cy='.3' r='.5'><stop offset='0' stop-color='%2390b8ff' stop-opacity='.7'/><stop offset='1' stop-color='%2390b8ff' stop-opacity='0'/></radialGradient></defs><rect width='1600' height='1000' fill='url(%23a)'/><rect width='1600' height='1000' fill='url(%23b)'/></svg>") center/cover; }
  body.demo.light { background: #e9eef6 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000'><defs><radialGradient id='a' cx='.3' cy='.4' r='.8'><stop offset='0' stop-color='%23ffffff'/><stop offset='1' stop-color='%23c9d6ea'/></radialGradient></defs><rect width='1600' height='1000' fill='url(%23a)'/></svg>") center/cover; }
  .dbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; z-index: 9;
    background: rgba(20,27,43,.82); border: 1px solid #2a3450; border-radius: 12px; }
  .dbar button { font: inherit; font-size: 13px; color: #cfd6e6; background: transparent; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .dbar button:hover { background: #222b40; }
  @media (prefers-reduced-motion: reduce) { .lg-ln, .lg-am, .lg-pl { animation-duration: .01s; animation-delay: 0s; } }
</style>
</head>

</div>
<script>
(() => {
  const W = '#fff';
  const line = (d, w = 1.8) => `<path d="${d}" stroke="${W}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  // Те же плитки, что в программе (icons.js): [светлый, тёмный, знак, подпись]
  const TOOLS = [
    ['#ff8d5e', '#dc4a24', `<rect x="5" y="5.6" width="6.2" height="5.4" rx="1.1" fill="${W}"/><rect x="12.8" y="5.6" width="6.2" height="5.4" rx="1.1" fill="${W}"/><rect x="5" y="13" width="6.2" height="5.4" rx="1.1" fill="${W}"/><rect x="12.8" y="13" width="6.2" height="5.4" rx="1.1" fill="${W}" opacity=".6"/>`, 'Slides'],
    ['#e8b45a', '#9a5b17', `<path d="M6.3 6.4A1.6 1.6 0 0 1 7.9 4.8h9.8v12.6H7.9a1.6 1.6 0 0 0-1.6 1.6z" fill="${W}"/><path d="M6.3 19a1.6 1.6 0 0 1 1.6-1.6h9.8V19.2H7.9" fill="${W}" opacity=".6"/><path d="M12 7.2v7.2M9.4 9.7h5.2" stroke="{d}" stroke-width="1.7" stroke-linecap="round"/>`, 'Bible'],
    ['#5fd68a', '#16864a', `<path d="M4.6 7.2l4.6-1.9 5.6 1.9 4.6-1.9v11.5l-4.6 1.9-5.6-1.9-4.6 1.9z" fill="${W}"/><path d="M9.2 5.3v11.5M14.8 7.2v11.5" stroke="{d}" stroke-width="1.1" opacity=".5"/><path d="M14.8 9.1a1.9 1.9 0 1 0-3.8 0c0 1.5 1.9 3.4 1.9 3.4s1.9-1.9 1.9-3.4z" fill="{d}"/>`, 'Maps'],
    ['#a985ff', '#6431d6', `<rect x="4.4" y="7" width="11.2" height="10" rx="2.2" fill="${W}"/><path d="M16.6 10.6l3.4-2.1v7l-3.4-2.1z" fill="${W}"/><path d="M8.8 9.8v4.4l3.6-2.2z" fill="{d}"/>`, 'Video'],
    ['#4fd6ff', '#0f7fd6', `<circle cx="12" cy="13.4" r="2.2" fill="${W}"/>` + line('M8.6 16.8a4.8 4.8 0 0 1 0-6.8M15.4 10a4.8 4.8 0 0 1 0 6.8M6.2 19.2a8.2 8.2 0 0 1 0-11.6M17.8 7.6a8.2 8.2 0 0 1 0 11.6', 1.6), 'Sources'],
    ['#ff6aa8', '#c0266d', line('M10 16.6V7.1l8-1.9v9.4') + `<circle cx="7.9" cy="16.6" r="2.3" fill="${W}"/><circle cx="15.9" cy="14.6" r="2.3" fill="${W}"/>`, 'Music'],
    ['#ffa04a', '#d4570c', `<path d="M5.8 18.2l.9-3.8 8.8-8.8a1.7 1.7 0 0 1 2.4 0l.5.5a1.7 1.7 0 0 1 0 2.4l-8.8 8.8z" fill="${W}"/><path d="M14 7.1l2.9 2.9" stroke="{d}" stroke-width="1.4"/>`, 'Editor'],
    ['#33d6c3', '#0a857a', `<rect x="7.6" y="4.8" width="11.6" height="9" rx="1.6" fill="${W}" opacity=".5"/><rect x="4.8" y="7.8" width="11.6" height="10.4" rx="1.6" fill="${W}"/><circle cx="8.5" cy="11.3" r="1.3" fill="{d}"/><path d="M6.4 16.7l3.1-3.2 2.2 2.2 1.6-1.6 2 2.6z" fill="{d}"/>`, 'Media'],
    ['#cb8cff', '#7b35e6', `<path d="M12 5a7 7 0 0 0 0 14c1.2 0 1.7-.8 1.3-1.8-.4-1 .2-2 1.3-2H16a3 3 0 0 0 3-3C19 8.1 15.9 5 12 5z" fill="${W}"/><circle cx="8.6" cy="11.4" r="1.2" fill="#ef4444"/><circle cx="10.6" cy="8.3" r="1.2" fill="#f59e0b"/><circle cx="14" cy="8.2" r="1.2" fill="#22c55e"/><circle cx="16" cy="11" r="1.2" fill="#3b82f6"/>`, 'Themes'],
    ['#ffd04a', '#e09600', line('M5.6 7.6h9M5.6 11.6h9M5.6 15.6h5.4', 1.9) + `<path d="M14.8 13.4l4.6 2.7-4.6 2.7z" fill="${W}"/>`, 'Playlists'],
    ['#5bd0ff', '#1d7fe0', `<rect x="4.2" y="7.6" width="11" height="8.8" rx="2" fill="${W}"/><path d="M16.2 10.8l3.6-2.2v6.8l-3.6-2.2z" fill="${W}"/><circle cx="9.7" cy="12" r="2.1" fill="{d}"/>`, 'Cameras'],
    ['#5b95ff', '#1d4fd8', `<rect x="5" y="6.3" width="14" height="9.6" rx="1.7" fill="none" stroke="${W}" stroke-width="1.8"/><rect x="7.3" y="8.6" width="9.4" height="5" rx=".6" fill="${W}" opacity=".35"/>` + line('M9.4 19h5.2M12 16v3'), 'Screens'],
  ];
  const tile = ([a, b, g], i) => `<svg viewBox="0 0 24 24"><defs><linearGradient id="t${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`
    + `<rect width="24" height="24" rx="6" fill="url(#t${i})"/><path d="M6 0h12a6 6 0 0 1 6 6v3.2C18 11 6 11 0 9.2V6a6 6 0 0 1 6-6z" fill="#fff" opacity=".16"/>`
    + `<rect x=".5" y=".5" width="23" height="23" rx="5.5" fill="none" stroke="#000" stroke-opacity=".18"/>` + g.replace(/\{d\}/g, b) + '</svg>';
  const LOGO = `<svg viewBox="16 16 480 480"><rect x="16" y="16" width="480" height="480" rx="108" fill="#0F1420"/>`
    + `<path d="M16 124a108 108 0 0 1 108-108h264a108 108 0 0 1 108 108v40C380 200 132 200 16 164z" fill="#fff" opacity=".06"/>`
    + `<rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>`
    + `<g transform="translate(86,96) scale(2.833)"><g opacity=".45"><rect class="lg-ln" x="6" y="6" width="72" height="50" rx="10"/></g>`
    + `<rect class="lg-ln b" x="24" y="28" width="72" height="50" rx="10"/><rect class="lg-am" x="42" y="52" width="74" height="54" rx="11"/>`
    + `<path class="lg-pl" d="M71 66 L71 92 L93 79 Z"/></g></svg>`;

  const $ = (id) => document.getElementById(id);
  const card = $('card'), glow = $('glow'), label = $('label'), ring = $('ring'), words = $('words'), wait = $('wait');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P = 'perspective(520px) ';
  const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  let run = 0;

  function show(i) {
    const t = TOOLS[i];
    card.innerHTML = tile(t, i);
    glow.style.setProperty('--g', t[0] + '99');
    label.textContent = t[3];
  }
  async function flip(set, dur, my) {
    await anim(card, [{ transform: P + 'rotateY(0) scale(1)' }, { transform: P + 'rotateY(90deg) scale(.92)' }], { duration: dur * .45, easing: 'cubic-bezier(.55,0,1,.45)' });
    if (my !== run) return;
    set();
    await anim(card, [{ transform: P + 'rotateY(-90deg) scale(.92)' }, { transform: P + 'rotateY(0) scale(1)' }], { duration: dur * .55, easing: 'cubic-bezier(0,.55,.35,1)' });
  }

  // Программа готова раньше конца анимации (main.js зовёт finish) — hurry: оставшиеся иконки пропускаем,
  // сразу и быстро показываем значок с надписью, и только тогда окно программы открывается
  let hurry = false, shown = null, shownOk = null;
  window.finish = () => { hurry = true; return shown; };

  async function play() {
    const my = ++run;
    document.getAnimations().forEach((a) => a.cancel());
    words.style.width = '0px'; wait.classList.remove('on'); hurry = false;
    shown = new Promise((r) => { shownOk = r; });
    window.animDone = shown;
    if (still) { card.innerHTML = LOGO; card.style.opacity = 1; words.style.width = '324px'; words.firstElementChild.style.opacity = 1; $('smoke').style.opacity = 1; shownOk(); return; }
    show(0);
    anim(glow, [{ opacity: 0 }, { opacity: .55 }], { duration: 250 });
    anim(label, [{ opacity: 0, transform: 'translate(-50%, 6px)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { duration: 220, delay: 60 });
    await anim(card, [{ opacity: 0, transform: P + 'scale(.3) rotateZ(-12deg)' }, { opacity: 1, transform: P + 'scale(1)' }], { duration: 300, easing: 'cubic-bezier(.3,1.5,.5,1)' });
    // Первая иконка видна полсекунды, дальше каждая следующая быстрее — последние мелькают
    if (!hurry) await pause(200);
    const N = TOOLS.length - 1, SLOW = 210, FAST = 45;
    for (let i = 1; i <= N && !hurry; i++) {
      if (my !== run) return;
      await flip(() => show(i), SLOW * Math.pow(FAST / SLOW, (i - 1) / (N - 1)), my);
    }
    if (my !== run) return;
    const q = hurry ? .5 : 1; // спешим — значок и надпись быстрее
    // Последний — значок программы
    anim(label, [{ opacity: 1 }, { opacity: 0 }], { duration: 140 });
    await flip(() => { card.innerHTML = LOGO; glow.style.setProperty('--g', '#F5A52480'); }, 300 * q, my);
    if (my !== run) return;
    anim(card, [{ transform: P + 'scale(1)' }, { transform: P + 'scale(1.1)' }, { transform: P + 'scale(1)' }], { duration: 380 * q, easing: 'cubic-bezier(.3,1.4,.5,1)' });
    anim(ring, [{ opacity: .9, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.9)' }], { duration: 600 * q, easing: 'cubic-bezier(.2,.8,.2,1)' });
    await pause(hurry ? 70 : 260);
    if (my !== run) return;
    // Надпись выезжает из-за значка, значок отходит влево
    const wq = hurry ? .5 : 1;
    anim(glow, [{ opacity: .55 }, { opacity: .3 }], { duration: 500 });
    anim($('smoke'), [{ opacity: 0, transform: 'scaleX(.4)' }, { opacity: 1, transform: 'none' }], { duration: 600 * wq, easing: 'cubic-bezier(.2,.8,.2,1)' });
    anim(words, [{ width: '0px' }, { width: '324px' }], { duration: 560 * wq, easing: 'cubic-bezier(.2,.9,.2,1)' });
    await anim(words.firstElementChild, [{ opacity: 0, transform: 'translateX(-30px)', filter: 'drop-shadow(0 2px 8px rgba(0,0,0,.55)) blur(6px)' },
      { opacity: 1, transform: 'none', filter: 'drop-shadow(0 2px 8px rgba(0,0,0,.55)) drop-shadow(0 0 1.5px rgba(0,0,0,.5))' }], { duration: 480 * wq, delay: 60 * wq, easing: 'cubic-bezier(.2,.8,.2,1)' });
    await pause(hurry ? 160 : 300); // чтобы надпись успели увидеть
    if (my !== run) return;
    shownOk();
    setTimeout(() => { if (my === run) wait.classList.add('on'); }, 500); // программа ещё грузится — тонкая полоска
  }

  // Убрать заставку: лёгкое приближение и растворение
  window.bye = () => { run++; wait.classList.remove('on');
    return anim($('stage'), [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.06)' }], { duration: 300, easing: 'ease-in' }); };

  if (new URLSearchParams(location.search).has('demo')) {
    document.body.classList.add('demo');
    document.body.insertAdjacentHTML('beforeend', `<div class="dbar"><button id="dAgain">↻ Заново</button><button id="dFin">Программа готова →</button><button id="dBg">Светлый стол</button></div>`);
    $('dAgain').onclick = () => { $('stage').getAnimations().forEach((a) => a.cancel()); play(); };
    $('dFin').onclick = () => window.finish().then(() => window.bye());
    $('dBg').onclick = (e) => { const l = document.body.classList.toggle('light'); e.target.textContent = l ? 'Тёмный стол' : 'Светлый стол'; };
  }
  play();
})();
</script>
