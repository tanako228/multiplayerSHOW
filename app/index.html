<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<link rel="icon" href="/icon.png">
<title>MP Show — группа</title>
<!-- Приложение для телефонов группы (ТЗ-8-Группа.md). Этап 0 — только проверка: адрес, сертификат, связь с программой.
     Само приложение (песни, текущий слайд, пометки) появится на этапе 1 -->
<style>
  :root { --ink: #0e1014; --panel: #181b21; --line: #2e3540; --text: #e8ebf0; --muted: #8b94a3; --ok: #3fb950; --bad: #e5484d; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--text); font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 18px 28px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { margin: 0; font-size: 20px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  .row b { flex: none; width: 1.2em; }
  .ok b { color: var(--ok); } .bad b { color: var(--bad); }
  p { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header><img src="/icon.png" alt=""><h1>multiplayerSHOW — группа</h1></header>
  <div class="row" id="https"><b>…</b><span>Защищённое соединение</span></div>
  <div class="row" id="link"><b>…</b><span>Связь с программой</span></div>
  <div class="row" id="sw"><b>…</b><span>Можно установить как приложение</span></div>
  <p>Это проверочная страница. Если все три строки зелёные — адрес и сертификат настроены верно. Песни, текущий слайд и пометки появятся здесь в следующих версиях программы.</p>
</main>
<script>
const mark = (id, ok, text) => { const el = document.getElementById(id); el.className = 'row ' + (ok ? 'ok' : 'bad'); el.querySelector('b').textContent = ok ? '✓' : '✗'; if (text) el.querySelector('span').textContent = text; };
mark('https', location.protocol === 'https:', location.protocol === 'https:' ? 'Защищённое соединение (' + location.host + ')' : 'Без защиты (http) — установить приложение не получится');
fetch('/app/ping', { cache: 'no-store' }).then((r) => r.json()).then((j) => mark('link', j.app === 'church-presenter', 'Связь с программой есть'))
  .catch(() => mark('link', false, 'Нет связи с программой'));
mark('sw', window.isSecureContext && 'serviceWorker' in navigator, window.isSecureContext ? 'Можно установить как приложение' : 'Установка недоступна: нужен https-адрес');
</script>
</body>
</html>
