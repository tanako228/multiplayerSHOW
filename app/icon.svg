<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#DFE8FF"/><stop offset="1" stop-color="#C2D1FA"/></linearGradient>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.2  0 0 0 0 0.32  0 0 0 0.09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <filter id="r1" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="8" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="r2" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="10" height="10" fill="none"/><line x1="0" y1="0" x2="0" y2="10" stroke="#2A3550" stroke-width="2.5" opacity="0.35"/></pattern>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="#fff" filter="url(#paper)"/>

<g transform="translate(-14 4)">
<!-- листок с песней -->
<g transform="rotate(-7 235 255)">
  <path d="M128 120 L326 120 L356 150 L356 404 L128 404 Z" fill="#9DB3FF" opacity="0.55" transform="translate(10 10)" filter="url(#r2)"/>
  <path d="M120 110 L320 110 L350 140 L350 400 L120 400 Z" fill="#FFF8EC" filter="url(#r2)"/>
  <g fill="none" stroke="#2A3550" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#r1)">
    <path d="M120 110 L320 110 L350 140 L350 400 L120 400 Z"/>
    <path d="M320 112 L322 140 L348 141" />
  </g>
  <path d="M322 140 L348 141 L322 114 Z" fill="url(#hatch)" filter="url(#r2)"/>
  <g fill="none" stroke="#8FA8F5" stroke-width="4" stroke-linecap="round" filter="url(#r2)">
    <path d="M142 160 L328 160"/><path d="M142 176 L328 176"/><path d="M142 192 L328 192"/><path d="M142 208 L328 208"/><path d="M142 224 L328 224"/>
  </g>
  <g fill="#2A3550" filter="url(#r2)">
    <ellipse cx="176" cy="208" rx="10" ry="7.5" transform="rotate(-20 176 208)"/><rect x="183" y="160" width="4" height="48"/>
    <ellipse cx="220" cy="192" rx="10" ry="7.5" transform="rotate(-20 220 192)"/><rect x="227" y="146" width="4" height="46"/>
    <ellipse cx="264" cy="200" rx="10" ry="7.5" transform="rotate(-20 264 200)"/><rect x="271" y="152" width="4" height="48"/>
  </g>
  <g fill="none" stroke="#B9C3DA" stroke-width="7" stroke-linecap="round" filter="url(#r1)">
    <path d="M144 270 q14 -9 28 0 t28 0 t28 0 t28 0 t28 0 t28 0"/>
    <path d="M144 304 q14 -9 28 0 t28 0 t28 0 t28 0 t28 0"/>
    <path d="M144 338 q14 -9 28 0 t28 0 t28 0"/>
  </g>
</g>

<!-- большая двойная нота -->
<g id="note">
  <g fill="#2A3550" stroke="#2A3550" stroke-width="16" stroke-linejoin="round" filter="url(#r1)">
    <ellipse cx="290" cy="372" rx="36" ry="27" transform="rotate(-22 290 372)"/>
    <ellipse cx="382" cy="346" rx="36" ry="27" transform="rotate(-22 382 346)"/>
    <rect x="309" y="232" width="14" height="138"/><rect x="401" y="206" width="14" height="138"/>
    <path d="M309 232 L415 204 L415 240 L309 268 Z"/>
  </g>
  <g fill="#FFC977" filter="url(#r2)">
    <ellipse cx="290" cy="372" rx="35" ry="26" transform="rotate(-22 290 372)"/>
    <ellipse cx="382" cy="346" rx="35" ry="26" transform="rotate(-22 382 346)"/>
    <rect x="310" y="236" width="12" height="132"/><rect x="402" y="210" width="12" height="132"/>
    <path d="M310 233 L414 205 L414 239 L310 267 Z"/>
  </g>
  <g fill="none" stroke="#FFF1D6" stroke-width="7" stroke-linecap="round" filter="url(#r2)">
    <path d="M268 362 q8 -12 22 -15"/><path d="M360 336 q8 -12 22 -15"/><path d="M322 246 L398 226"/>
  </g>
</g>

<!-- маленькая нотка и искорки -->
<g filter="url(#r1)">
  <g fill="#2A3550" stroke="#2A3550" stroke-width="12" stroke-linejoin="round">
    <ellipse cx="380" cy="160" rx="19" ry="14" transform="rotate(-22 380 160)"/><rect x="391" y="96" width="8" height="64"/>
  </g>
  <g fill="#9DB3FF"><ellipse cx="380" cy="160" rx="18" ry="13" transform="rotate(-22 380 160)"/><rect x="392" y="100" width="6" height="58"/></g>
  <path d="M396 98 q26 10 22 40" fill="none" stroke="#2A3550" stroke-width="8" stroke-linecap="round"/>
</g>
<g fill="#FFB85C" stroke="#2A3550" stroke-width="5" stroke-linejoin="round" filter="url(#r2)">
  <path d="M150 432 l7 -17 l7 17 l17 7 l-17 7 l-7 17 l-7 -17 l-17 -7 z" transform="translate(-12 -40) scale(0.9)"/>
  <path d="M428 268 l5 -12 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 z"/>
</g>
<g fill="#2A3550" filter="url(#r2)"><circle cx="352" cy="96" r="5"/><circle cx="108" cy="420" r="4"/></g>
</g>
</svg>
