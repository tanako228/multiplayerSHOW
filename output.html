<!DOCTYPE html>
<html lang="ru" data-i18n-manual>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src file: data:; media-src file:; style-src 'self' 'unsafe-inline'; font-src 'self' file: data:">
  <title>Вывод</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    body.win { cursor: default; }
    #stage { position: absolute; overflow: hidden; background: #000; }
    /* Альфа-канал (NDI с прозрачным фоном): без чёрного фона */
    html.alpha, html.alpha body, html.alpha #stage { background: transparent; }
    /* Прозрачное окно без рамки (main.js): переносится за любое место */
    html.alpha body.win { -webkit-app-region: drag; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="i18n.js"></script>
  <script src="lang.js"></script>
  <script src="scene.js"></script>
  <script src="compose.js"></script>
  <script src="output.js"></script>
</body>
</html>
