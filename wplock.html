<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>MP Show</title>
<!-- Окно оператора, пока этим компьютером управляют с другого (workplace.js). Цвета — темы окна программы
     (wpui.js присылает их перед передачей управления), по умолчанию — «Тёмно-синяя». -->
<style>
  :root { --ink: #0F1420; --panel: #171E2E; --field: #212A3D; --line: #2C3750; --text: #E8ECF5; --muted: #8C97AD; --live: #4C7DFF; --live-ink: #fff; --warn: #FF6B5B; --rk: 1; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg, var(--ink)); color: var(--text); font: 14px var(--font, system-ui, 'Segoe UI', sans-serif); display: grid; place-items: center; user-select: none; }
  .card { width: min(460px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: calc(16px * var(--rk)); box-shadow: 0 12px 40px rgba(0, 0, 0, .35); overflow: hidden; }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 28%, transparent); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--live) 10%, transparent); } }
  .dlg-body { padding: 16px 18px; line-height: 1.5; }
  .who { font-size: 18px; font-weight: 600; margin: 2px 0 10px; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  button { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: calc(8px * var(--rk)); padding: 7px 14px; cursor: pointer; }
  button:hover { border-color: var(--live); }
  button.primary { background: var(--live); color: var(--live-ink); border-color: var(--live); }
  button:disabled { opacity: .5; cursor: default; }
  #ask[hidden], #lost[hidden] { display: none; }
  #lost { color: var(--warn); margin: 10px 0 0; }
  body.lost .dot { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 28%, transparent); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #ask { border-top: 1px solid var(--line); padding: 12px 18px; background: color-mix(in srgb, var(--warn) 10%, var(--panel)); }
</style>
</head>
<body>
  <div class="card" role="dialog" aria-labelledby="t">
    <div class="dlg-head"><span class="dot" aria-hidden="true"></span><h2 id="t">Управляют с другого компьютера</h2></div>
    <div class="dlg-body">
      <div class="who" id="who">—</div>
      <div>Экраны показа работают как обычно: ими сейчас командует этот компьютер.</div>
      <p class="hint" id="since"></p>
      <p id="lost" hidden></p>
    </div>
    <div id="ask" hidden>
      <div>Закрыть программу? Экраны погаснут, и «<span id="who2"></span>» потеряет управление.</div>
      <div class="dlg-foot" style="border:0;padding:10px 0 0"><button id="askNo">Отмена</button><button id="askYes" class="primary">Закрыть программу</button></div>
    </div>
    <div class="dlg-foot"><button id="take" class="primary">Забрать управление</button></div>
  </div>
<script src="i18n.js"></script>
<script src="lang.js"></script>
<script>
(function () { // своя область: глобальное имя api уже занято (preload.js)
  const $ = (id) => document.getElementById(id);
  const api = window.api;
  function render(s) {
    if (!s) return;
    const v = s.host.vars;
    if (v) for (const [k, x] of Object.entries(v)) if (x) document.documentElement.style.setProperty(k === 'font' ? '--font' : k === 'bg' ? '--bg' : k, x);
    const p = s.host.peer;
    $('who').textContent = p ? '«' + p.name + '»' : '—';
    $('who2').textContent = p ? p.name : '';
    $('since').textContent = p ? 'Адрес ' + p.ip + ', с ' + new Date(p.at).toLocaleTimeString().slice(0, 5) : '';
    // Связь пропала: ждём, что тот компьютер переподключится сам; можно не ждать — «Забрать управление»
    const lost = !!(p && p.lostUntil);
    document.body.classList.toggle('lost', lost);
    $('lost').hidden = !lost;
    if (lost) $('lost').textContent = 'Связь с «' + p.name + '» прервалась. Жду, что он переподключится (до ' + new Date(p.lostUntil).toLocaleTimeString().slice(0, 5) + '), — или заберите управление.';
  }
  api.wpState().then(render);
  api.onWpState(render);
  $('take').addEventListener('click', () => { $('take').disabled = true; $('take').textContent = 'Забираю…'; api.wpTake(); });
  api.onAskClose(() => { $('ask').hidden = false; $('askNo').focus(); });
  $('askNo').addEventListener('click', () => { $('ask').hidden = true; });
  $('askYes').addEventListener('click', () => api.closeOk());
})();
</script>
</body>
</html>
